# OrbStack only (docs/dry-run.md step 5): a drop-in for
# radio-boot-check.service. An OrbStack machine shares the kernel of the
# OrbStack VM, so /proc/uptime is that VM's uptime, not the machine's, and
# the boot check would always report LATE. The machine's own uptime is the
# age of its PID 1.
#
#   sudo install -m 0644 tests/dryrun/orbstack-uptime.conf \
#     /etc/systemd/system/radio-boot-check.service.d/orbstack-uptime.conf
[Service]
ExecStart=
ExecStart=/bin/sh -c 'RADIOCTL_UPTIME0=$$(ps -o etimes= -p 1 | tr -d " ") exec /opt/radio-atlantida/deploy/bin/radioctl boot-check'
