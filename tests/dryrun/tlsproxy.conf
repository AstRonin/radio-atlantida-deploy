# TLS in front of the dry run's test Icecast (tests/dryrun/compose.override.yml):
# icecast.test:8443 accepts TLS only, like the production server on 8001.
pid /tmp/nginx.pid;
events {}
stream {
  resolver 127.0.0.11 valid=10s;
  server {
    listen 8443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    set $upstream icecast-test:8000;
    proxy_pass $upstream;
  }
}
