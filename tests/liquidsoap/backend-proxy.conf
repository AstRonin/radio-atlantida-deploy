# The service `backend` of the smoke stack (tests/liquidsoap/compose.yml): a
# TCP proxy from backend:8090, which the production script calls, to the stub
# backend of the smoke tool on the host (port 18090).
pid /tmp/nginx.pid;
events {}
stream {
  server {
    listen 8090;
    proxy_pass host.docker.internal:18090;
  }
}
