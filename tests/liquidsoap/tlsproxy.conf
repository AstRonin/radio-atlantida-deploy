# TLS proxy in front of the test Icecast (tests/liquidsoap/compose.yml), as
# the backend's dev/liqsmoke/nginx.conf: the source connection of the script
# over TLS, as to the production server (deploy-init-plan.md 5.4).
pid /tmp/nginx.pid;
events {}
stream {
  server {
    listen 8443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    proxy_pass icecast:8000;
  }
}
