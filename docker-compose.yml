# Production stack of Radio Atlantida (docs/deploy-init-plan.md D2,
# docs/tech-design.md §9). Run only through bin/radioctl (update.bat), which
# calls Compose with
#
#   --env-file .env --env-file runtime/applied.env --env-file runtime/network.env
#
# and adds `--profile monitoring` when MONITORING_ENABLED=true.
#
# Rules (deploy-init-plan.md §1, §1.1):
# - Infrastructure images are pinned here, literally; they equal the backend's
#   docker-compose.dev.yml at v${BACKEND_TAG} (checked by CI). No floating tags.
# - Application images come by tag and multi-arch manifest list digest from
#   runtime/applied.env (written from release.env by radioctl).
# - No Icecast service: the stream goes to an external server configured in
#   the backend's stream.* settings.
# - Published ports: the panel and Grafana on 127.0.0.1 only, and the live
#   voice UDP port on LIVE_UDP_BIND (127.0.0.1 mirrored, 0.0.0.0 NAT; 6.5).
#   Nothing else.

name: radio-atlantida

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-image: &backend-image ghcr.io/astronin/radio-atlantida-backend:${BACKEND_TAG:?run through radioctl}@${BACKEND_DIGEST:?run through radioctl}

x-database-url: &database-url postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}?sslmode=disable

services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [radio]
    logging: *logging

  # Playout. Plays from its queues, its emergency source, and the safety tone
  # without the backend, so it depends on nothing. Restarted only in a
  # maintenance window (update.bat maintenance, 11.5). The control port (1234)
  # and the harbor (8005) stay on the internal network (design §8.9).
  liquidsoap:
    image: savonet/liquidsoap:v2.4.6
    restart: unless-stopped
    command: ["/etc/liquidsoap/radio.liq"]
    environment:
      TZ: UTC
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set in .env}
      LIQUIDSOAP_CONTROL_USER: ${LIQUIDSOAP_CONTROL_USER:-source}
      LIQUIDSOAP_CONTROL_PASSWORD: ${LIQUIDSOAP_CONTROL_PASSWORD:?set in .env}
      TELNET_PORT: "1234"
      HARBOR_PORT: "8005"
      JOURNAL_DIR: /journal
      BACKEND_CALLBACK_URL: http://backend:8090/api/playout/callback
      BACKEND_EMERGENCY_URL: http://backend:8090/api/playout/emergency/next
      # The stream output at startup (design §8.8, plan 5.2): the backend, then
      # OUTPUT_STATE_FILE, then ICECAST_* with the settings defaults. The
      # backend corrects it with output.set once the control link connects.
      BACKEND_OUTPUT_URL: http://backend:8090/api/playout/output
      # The last output that connected. In the image's own directory, owned by
      # the liquidsoap user, so the new volume takes that owner.
      OUTPUT_STATE_FILE: /var/cache/liquidsoap/output.json
      # Only makes the environment fallback match the production server (TLS);
      # host, port, and mount come from the backend settings.
      ICECAST_TLS: "true"
    volumes:
      - type: bind
        source: ${MEDIA_ROOT:?set in .env}
        target: /media
        read_only: true
        bind:
          # A missing Windows drive fails the container instead of showing an
          # empty folder created by Docker.
          create_host_path: false
      - ${PLAYOUT_JOURNAL_ROOT:?set in .env}:/journal
      - ./config/liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - liquidsoap-state:/var/cache/liquidsoap
    healthcheck:
      # The telnet control port answers: send `quit`, expect `Bye!`.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1234 && echo quit >&3 && timeout 2 grep -q Bye <&3"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [radio]
    logging: *logging

  # Applies the migrations once and exits (design §9.2). Same image as backend.
  migrate:
    image: *backend-image
    restart: "no"
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: *database-url
    # The image health check probes the HTTP server, which migrate does not run.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    networks: [radio]
    logging: *logging

  # API, WebSocket, rotation, outage detection, live voice bridge, Loki push.
  # Health check: the image's HEALTHCHECK on /healthz (port 8090).
  backend:
    image: *backend-image
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      MEDIA_ROOT: /media
      PLAYOUT_JOURNAL_ROOT: /journal
      # The code default 127.0.0.1:8090 is unreachable from nginx and from
      # Liquidsoap; the image health check assumes port 8090.
      HTTP_ADDR: 0.0.0.0:8090
      LOKI_URL: http://loki:3100
      # Live voice (WebRTC): one UDP socket; the bridge offers LIVE_PUBLIC_IPS
      # as its host candidate (127.0.0.1 mirrored, the WSL VM's eth0 address
      # in NAT mode; 6.5).
      LIVE_UDP_ADDR: 0.0.0.0:8189
      LIVE_PUBLIC_IPS: ${LIVE_PUBLIC_IPS:?written by radioctl}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set in .env}
      LIQUIDSOAP_CONTROL_USER: ${LIQUIDSOAP_CONTROL_USER:-source}
      LIQUIDSOAP_CONTROL_PASSWORD: ${LIQUIDSOAP_CONTROL_PASSWORD:?set in .env}
    # The media folder's files appear in WSL with group radio-media (gid 10001)
    # and group write (6.6); the backend user (uid 10001) writes fixed files.
    group_add: ["10001"]
    ports:
      - "${LIVE_UDP_BIND:?written by radioctl}:8189:8189/udp"
    volumes:
      # Read-write: a transcode, "Fix loudness", and Replace file write here
      # (design §8.7).
      - type: bind
        source: ${MEDIA_ROOT:?set in .env}
        target: /media
        bind:
          create_host_path: false
      # Playout journal, read for reconciliation (design §7.1).
      - ${PLAYOUT_JOURNAL_ROOT:?set in .env}:/journal:ro
    # HTTP drain 15 s plus up to 10 s for the components; Docker's 10 s default
    # would kill it mid-drain.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [radio]
    logging: *logging

  # Panel (nginx, proxies /api to backend). No dependency on backend: nginx
  # resolves it per request and answers /api with 502 until it is up.
  # Health check: the image's HEALTHCHECK.
  frontend:
    image: ghcr.io/astronin/radio-atlantida-frontend:${FRONTEND_TAG:?run through radioctl}@${FRONTEND_DIGEST:?run through radioctl}
    restart: unless-stopped
    environment:
      # http://127.0.0.1:${GRAFANA_PORT} with monitoring on, empty (no link)
      # with it off; written by radioctl into runtime/applied.env.
      GRAFANA_URL: ${GRAFANA_URL:-}
    ports:
      - "127.0.0.1:${PANEL_PORT:-8080}:8080"
    networks: [radio]
    logging: *logging

  # Creates or updates the read-only role grafana_ro (config/grafana/role.sql)
  # with GRAFANA_DB_PASSWORD and exits; grafana starts only after it succeeds
  # (design §10.3). POSTGRES_USER is a superuser in the official image.
  grafana-role:
    profiles: ["monitoring"]
    image: postgres:17.11
    restart: "no"
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/role.sql"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
      # Monitoring variables use :- so the stack renders with monitoring off;
      # radioctl's preflight requires them when it is on.
      PGOPTIONS: -c radio.grafana_password=${GRAFANA_DB_PASSWORD:-}
    volumes:
      - ./config/grafana/role.sql:/role.sql:ro
    # The image health check is for a server; this job only runs psql.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    networks: [radio]
    logging: *logging

  # Database view and log search (design §10.3, §10.4). Login required.
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Applied only when grafana-data is created.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The station machine may be offline.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Read by the data source file (provisioning/datasources/postgres.yaml).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      grafana-role:
        condition: service_completed_successfully
      # Started, not healthy: loki has no health check.
      loki:
        condition: service_started
    networks: [radio]
    logging: *logging

  # Log storage, a core service (design §10.4). Not published. No health
  # check: the image is distroless and loki has no health subcommand; the
  # backend and Alloy retry their pushes, so nothing waits for it.
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - loki-data:/loki
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
    networks: [radio]
    logging: *logging

  # Reads the playout journal (read-only) into Loki, a core service. Read
  # positions live in alloy-data. Its HTTP server listens on the container's
  # loopback only: nothing but the health check uses it.
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      - alloy-data:/var/lib/alloy/data
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${PLAYOUT_JOURNAL_ROOT:?set in .env}:/journal:ro
    healthcheck:
      # The image has bash but neither wget nor curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 2 head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      loki:
        condition: service_started
    networks: [radio]
    logging: *logging

networks:
  radio: {}

volumes:
  pgdata:
  liquidsoap-state:
  grafana-data:
  loki-data:
  alloy-data:
