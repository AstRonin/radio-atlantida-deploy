# /etc/wsl.conf of the radio-atlantida distribution (deploy-init-plan.md D4
# 6.3 step 1). Installed by setup-distro.sh; takes effect after
# `wsl --terminate radio-atlantida` (install.ps1 does it).

[boot]
# systemd starts containerd, Docker, and the radio-* units.
systemd=true

[user]
# The Linux user that owns the deploy repository and runs radioctl.
default=radio

[interop]
# A clean PATH inside the distribution (no Windows folders).
appendWindowsPath=false

[automount]
enabled=true
# install.ps1 converts the Windows media folder to /mnt/<drive>/...
root=/mnt/
# Every file on the Windows drives appears owned by radio (uid 1000) and
# group radio-media (gid 10001) with group write, so the backend (uid 10001
# with the supplementary group 10001) can write fixed files. No `metadata`:
# no per-file Linux permissions can drift from this (6.6). (verify on
# Windows: a transcode writes a fixed file into the media folder and the
# rename succeeds.)
options="uid=1000,gid=10001,umask=002,fmask=002"
